services:
  - type: web
    name: crypto-dashboard-api
    env: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: crypto-dashboard-db
          property: connectionString
      - key: REDIS_URL
        sync: false          # set manually from Upstash
      - key: JWT_SECRET
        generateValue: true
      - key: COINGECKO_API_URL
        value: https://api.coingecko.com/api/v3
      - key: BINANCE_WS_URL
        value: wss://stream.binance.com:9443/ws
      - key: ALLOWED_ORIGINS
        sync: false          # set to your Vercel URL, e.g. https://your-app.vercel.app

databases:
  - name: crypto-dashboard-db
    plan: free
    databaseName: cryptodash
    user: cryptodash_user
